# Plain HTTP backend; TLS and HSTS are handled by Nginx Proxy Manager.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Docusaurus hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        # Serve directory index files directly instead of redirecting,
        # so no absolute redirect URLs are generated behind the proxy.
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
